environments:
  sb-camastral:
    values:
      - ../defaults/60_sharepoint_connector.defaults.yaml
      - ./your-tenant-alias.yaml
---
repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts
releases:
  - name: sharepoint-connector-secret
    chart: bedag/raw
    namespace: apps
    createNamespace: true
    wait: false
    values:
      - resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: sharepoint-connector-secret
              namespace: apps
            type: Opaque
            data:
              UNIQUE_ZITADEL_CLIENT_SECRET: {{ .Values.sharepointConnector.secrets.UNIQUE_ZITADEL_CLIENT_SECRET | fetchSecretValue | b64enc | quote }}
              key.pem: {{ .Values.sharepointConnector.secrets.KEY_PEM | fetchSecretValue | b64enc | quote }}
  - name: sharepoint-connector
    chart: oci://ghcr.io/unique-ag/connectors/helm/sharepoint-connector
    version: 2.7.0
    namespace: apps
    createNamespace: true
    wait: false
    values:
      -
        connector:
          serviceAccount:
            enabled: true
            workloadIdentity:
              enabled: true
              clientId: {{ .Values.sharepointConnector.connector.serviceAccount.workloadIdentity.clientId }}
        connectorConfig:
          sharepoint:
            tenantId: {{ .Values.sharepointConnector.connectorConfig.sharepoint.tenantId }}
            baseUrl: {{ .Values.sharepointConnector.connectorConfig.sharepoint.baseUrl }}
            # -- Deployment-level defaults applied to every site (config_file rows or
            # sharepoint_list rows). Per-site values always win when set; empty/blank
            # values fall through to these defaults. Any field except siteId may be
            # defaulted here. Leave as `{}` to keep today's behaviour where every
            # field is supplied per-site.
            # Example:
            # siteDefaults:
            #   syncColumnName: FinanceGPTKnowledge
            #   ingestionMode: recursive
            #   scopeId: scope_xxx (or in_parent:scope_<parentId>)
            #   maxFilesToIngest: 10000
            #   storeInternally: enabled
            #   syncStatus: active
            #   syncMode: content_only
            #   permissionsInheritanceMode: inherit_scopes_and_files
            #   subsitesScan: disabled
            siteDefaults:
              syncColumnName: <your-sharepoint-sync-column-name>
              ingestionMode: recursive
              scopeId: in_parent:scope_<parentId> # root SharePoint scope
              maxFilesToIngest: 10000
              storeInternally: enabled
              syncStatus: active
              syncMode: content_only
              permissionsInheritanceMode: inherit_scopes_and_files
              subsitesScan: disabled
            # -- Sites source configuration
            # Determines how sites are configured: from static YAML (config_file) or dynamically from SharePoint list (sharepoint_list)
            # possible values: config_file, sharepoint_list
            sitesSource: config_file
            sites:
              {{ .Values.sharepointConnector.connectorConfig.sharepoint.sites | toYaml | nindent 14 }}
            auth:
              clientId: {{ .Values.sharepointConnector.connectorConfig.sharepoint.auth.clientId }}
              thumbprintSha1: {{ .Values.sharepointConnector.connectorConfig.sharepoint.auth.thumbprintSha1 }}
          unique:
            ingestionServiceBaseUrl: http://node-ingestion.chat.svc.cluster.local:8091
            scopeManagementServiceBaseUrl: http://node-scope-management.chat.svc.cluster.local:8094
            # -- Object containing extra HTTP headers for Unique API requests (GraphQL and REST)
            # Required when authMode is cluster_local. Must contain x-company-id and x-user-id headers.
            # example: {"x-company-id": "1234567890", "x-user-id": "1234567890"}
            serviceExtraHeaders:
              x-company-id: {{ index .Values.sharepointConnector.connectorConfig.unique.serviceExtraHeaders "x-company-id" | quote }}
              x-user-id: {{ index .Values.sharepointConnector.connectorConfig.unique.serviceExtraHeaders "x-user-id" | quote }}
          processing:
            # -- cron expression for the scheduled SharePoint scan interval default: every 15 minutes
            scanIntervalCron: {{ .Values.sharepointConnector.connectorConfig.processing.scanIntervalCron | quote }}